# Publication de l'application sur GitHub Pages à chaque push sur master.
# L'app est 100 % statique : on publie le dépôt tel quel, sans build.
# `enablement: true` active Pages (source « GitHub Actions ») au premier passage,
# sans réglage manuel dans Settings.
# Dépôt privé : GitHub Pages exige un compte Pro/Team ; sinon, passer le dépôt en public.
name: Pages
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf tests .github AUDIT*.md CHANGELOG.md   # inutiles en ligne
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
