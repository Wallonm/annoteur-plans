# Tests à chaque push et pull request : 52 tests Node sans dépendance,
# puis le test bout en bout Playwright dans Chromium (~2 min).
name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "tests/*.test.js"
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g playwright && npx playwright install --with-deps chromium
      - run: node tests/e2e/cote-et-couleurs.e2e.js
        env: { NODE_PATH: /usr/local/lib/node_modules }
